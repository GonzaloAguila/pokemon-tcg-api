name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # registry-url + scope write an .npmrc that reads NODE_AUTH_TOKEN
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@gonzaloaguila"

      # NPM_TOKEN: GitHub PAT with read:packages, needed for @gonzaloaguila/game-core
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
